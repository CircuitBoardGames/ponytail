name: Test

# The forge gate for this fork (CircuitBoardGames/ponytail). It runs what upstream's own
# .github/workflows/test.yml runs, adapted to the forge's host-mode runner: Python deps go into
# the job's own venv, never the shared runner home. Upstream's workflow stays untouched so syncs
# from true upstream stay clean; a present .forgejo/workflows is read INSTEAD of .github/.

on:
  pull_request:
  # No `push:` -- CI is preventative only, nothing runs after a merge.

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A draft never runs this: it runs once un-drafted.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: No conflict markers
        run: |
          rc=0; git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' || rc=$?
          [ "$rc" -eq 1 ] || { echo "conflict markers above, or git grep failed (rc=$rc)"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python deps for the correctness checks (job venv)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q pandas
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Check rule copies
        run: node scripts/check-rule-copies.js

      - name: Check version consistency
        run: node scripts/check-versions.js

      - name: Run tests
        run: npm test

      - name: Run benchmark selftest
        run: python3 benchmarks/agentic/run.py --selftest
